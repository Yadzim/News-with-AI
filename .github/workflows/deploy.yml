name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          missing=0
          if [ -z "$SSH_HOST" ]; then echo "::error::SSH_HOST secret yo‘q yoki bo‘sh"; missing=1; fi
          if [ -z "$SSH_USER" ]; then echo "::error::SSH_USER secret yo‘q yoki bo‘sh"; missing=1; fi
          if [ -z "$SSH_KEY" ]; then echo "::error::SSH_KEY secret yo‘q yoki bo‘sh"; missing=1; fi
          if [ "$missing" -eq 1 ]; then
            echo "Repo → Settings → Secrets and variables → Actions ga qo‘ying:"
            echo "  SSH_HOST / SSH_USER / SSH_KEY"
            echo "  SERVICE_BOT   (ixtiyoriy, default: news-bot)"
            echo "  SERVICE_ADMIN (ixtiyoriy, default: news-admin)"
            exit 1
          fi
          echo "Secrets OK"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          request_pty: true
          script_stop: true
          envs: SERVICE_BOT,SERVICE_ADMIN
          script: |
            set -e
            cd /var/www/news-bot
            git pull origin main
            npm ci

            BOT_SVC="${SERVICE_BOT:-news-bot}"
            ADMIN_SVC="${SERVICE_ADMIN:-news-admin}"

            echo "Restarting systemd: $BOT_SVC , $ADMIN_SVC"
            sudo systemctl restart "$BOT_SVC" "$ADMIN_SVC"
            sudo systemctl --no-pager --full status "$BOT_SVC" "$ADMIN_SVC" || true
        env:
          SERVICE_BOT: ${{ secrets.SERVICE_BOT }}
          SERVICE_ADMIN: ${{ secrets.SERVICE_ADMIN }}
