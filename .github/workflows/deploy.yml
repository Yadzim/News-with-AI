name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check deploy secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          missing=0
          if [ -z "$SSH_HOST" ]; then echo "::error::SSH_HOST secret yo‘q"; missing=1; fi
          if [ -z "$SSH_USER" ]; then echo "::error::SSH_USER secret yo‘q"; missing=1; fi
          if [ -z "$SSH_KEY" ]; then echo "::error::SSH_KEY secret yo‘q"; missing=1; fi
          if [ "$missing" -eq 1 ]; then exit 1; fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          request_pty: true
          script_stop: true
          # deploy.sh xizmatlar barqarorligini kuzatadi (bot ~30s + admin
          # health ~60s) va kerak bo‘lsa npm ci ham qiladi
          command_timeout: 5m
          envs: SERVICE_BOT,SERVICE_ADMIN
          script: |
            set -e
            cd /var/www/news-bot
            # Avval yangi deploy.sh ni tortib olamiz (eski skript osilib qolmasin)
            git fetch origin main
            git reset --hard origin/main
            chmod +x ./deploy.sh
            ./deploy.sh
        env:
          SERVICE_BOT: ${{ secrets.SERVICE_BOT }}
          SERVICE_ADMIN: ${{ secrets.SERVICE_ADMIN }}
