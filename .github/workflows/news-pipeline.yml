name: News Pipeline

# Asia/Tashkent 08:00 va 20:00 → UTC 03:00 va 15:00
on:
  schedule:
    - cron: "0 3,15 * * *"
  workflow_dispatch:

concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore SQLite database
        uses: actions/cache/restore@v4
        with:
          path: data/news.db
          key: news-db-${{ github.run_id }}
          restore-keys: |
            news-db-

      - name: Ensure data directory
        run: mkdir -p data

      - name: Fetch, AI process & publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          TOPIC_AI: ${{ secrets.TOPIC_AI }}
          TOPIC_HARDWARE: ${{ secrets.TOPIC_HARDWARE }}
          TOPIC_CYBERSECURITY: ${{ secrets.TOPIC_CYBERSECURITY }}
          TOPIC_STARTUPS: ${{ secrets.TOPIC_STARTUPS }}
          TOPIC_GENERAL_TECH: ${{ secrets.TOPIC_GENERAL_TECH }}
          DATABASE_PATH: ./data/news.db
        run: npm run pipeline

      - name: Save SQLite database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/news.db
          key: news-db-${{ github.run_id }}
